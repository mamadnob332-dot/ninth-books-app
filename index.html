<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>کتاب‌های پایه‌ی نهم</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#667085;--ac:#3b5bdb;--bd:#e3e6ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161c;--card:#1d2029;--tx:#eceef4;--mu:#9aa1b2;--ac:#8fa4ff;--bd:#2c303c}}
:root[data-theme="dark"]{--bg:#14161c;--card:#1d2029;--tx:#eceef4;--mu:#9aa1b2;--ac:#8fa4ff;--bd:#2c303c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.9}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:8px 0 4px}
p.sub{color:var(--mu);margin:0 0 14px;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.item{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;text-align:right;color:var(--tx);font:inherit;cursor:pointer;width:100%}
.item:active{border-color:var(--ac)}
.list{display:flex;flex-direction:column;gap:8px}
.back{background:none;border:0;color:var(--ac);font:inherit;cursor:pointer;padding:4px 0;margin-bottom:6px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.box h3{color:var(--ac);margin:16px 0 4px;font-size:1.05rem}
.box p{margin:6px 0}
.row{display:flex;gap:8px;margin-top:12px}
input{flex:1;min-width:0;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
.btn{background:var(--ac);color:var(--bg);border:0;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer}
.mu{color:var(--mu)}
.brand{text-align:center;font-family:'Noto Nastaliq Urdu','Nastaliq',serif;font-size:1.9rem;line-height:2.2;color:var(--ac);padding:14px 16px 0}
.chip{display:inline-block;background:var(--bd);border-radius:8px;padding:0 8px;font-size:.8rem;margin-inline-start:6px}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px 12px;margin:8px 0}summary{cursor:pointer}.a{color:var(--ac)}</style>
</head>
<body>
<div class="brand">حسن شاکری</div>
<main id="app"></main>
<script>
const BOOKS=["ریاضی","علوم تجربی","فارسی (ادبیات)","نگارش","عربی","انگلیسی","مطالعات اجتماعی","پیام‌های آسمان","تفکر و سبک زندگی","آمادگی دفاعی","هنر","کار و فناوری"];
/* برای افزودن محتوا: زیر نام کتاب، فصل‌ها را با عنوان و html بنویسید */
const DATA={
"ریاضی":[
{t:"مجموعه‌ها",h:`<h3>توضیح</h3><p>مجموعه دسته‌ای از چیزهای مشخص است و هر چیز داخل آن یک عضو نام دارد (نماد ∈). مثلاً اگر A = {۱، ۲، ۳} آنگاه ۲ ∈ A و ۵ ∉ A.</p><p><b>زیرمجموعه:</b> اگر همه‌ی عضوهای A در B هم باشند، A ⊆ B. مجموعه‌ی تهی (∅) زیرمجموعه‌ی هر مجموعه است و مجموعه‌ای با n عضو، ۲ به توان n زیرمجموعه دارد.</p><p><b>عمل‌ها:</b> اجتماع (A ∪ B): عضوهای A یا B. اشتراک (A ∩ B): عضوهای مشترک. تفاضل (A − B): عضوهای A که در B نیستند. متمم (A′): عضوهای مجموعه‌ی مرجع که در A نیستند.</p><p><b>فرمول شمارش:</b> n(A ∪ B) = n(A) + n(B) − n(A ∩ B)</p><h3>نمونه‌سوال</h3>
<details><summary>۱. اگر A = {۱،۲،۳،۴} و B = {۳،۴،۵}، مقدار A ∪ B و A ∩ B؟</summary><p class="a">A ∪ B = {۱،۲،۳،۴،۵} و A ∩ B = {۳،۴}</p></details>
<details><summary>۲. با همان مجموعه‌ها، A − B و B − A؟</summary><p class="a">A − B = {۱،۲} و B − A = {۵}</p></details>
<details><summary>۳. {a, b, c} چند زیرمجموعه دارد؟</summary><p class="a">۲ به توان ۳ = ۸ زیرمجموعه</p></details>
<details><summary>۴. مجموعه‌ی {x ∈ ℕ | x &lt; ۵} را بنویسید.</summary><p class="a">{۱،۲،۳،۴}</p></details>
<details><summary>۵. اگر U = {۱،…،۱۰} و A = {۲،۴،۶،۸}، متمم A؟</summary><p class="a">A′ = {۱،۳،۵،۷،۹،۱۰}</p></details>
<details><summary>۶. n(A)=۱۲، n(B)=۹ و n(A ∩ B)=۴؛ n(A ∪ B) چند است؟</summary><p class="a">۱۲ + ۹ − ۴ = ۱۷</p></details>
<details><summary>۷. درست یا نادرست: «{۲} ∈ {۱،۲،۳}»؟</summary><p class="a">نادرست. {۲} یک مجموعه است نه عضو؛ درست آن {۲} ⊆ {۱،۲،۳} است.</p></details>
<details><summary>۸. اشتراک «زوج‌های کمتر از ۱۰» و «اول‌های کمتر از ۱۰»؟</summary><p class="a">{۲،۴،۶،۸} ∩ {۲،۳،۵،۷} = {۲}</p></details>`},
{t:"عددهای حقیقی"},{t:"استدلال و اثبات در هندسه"},{t:"توان و ریشه"},{t:"عبارت‌های جبری"},{t:"خط و معادله‌های خطی"},{t:"عبارت‌های گویا"},{t:"حجم و مساحت"}]
};
const app=document.getElementById("app");
function home(){
  app.innerHTML='<h1>کتاب‌های پایه‌ی نهم</h1><p class="sub">یک کتاب را انتخاب کنید.</p><div class="grid">'+BOOKS.map((b,i)=>'<button class="item" data-i="'+i+'">'+b+'</button>').join("")+'</div>';
  app.querySelectorAll(".item").forEach(b=>b.onclick=()=>book(BOOKS[b.dataset.i]));
}
function book(n){
  const ch=DATA[n]||[];
  app.innerHTML='<button class="back" id="bk">→ بازگشت</button><h1>'+n+'</h1><div class="list" id="ls"></div>';
  document.getElementById("bk").onclick=home;
  const ls=document.getElementById("ls");
  if(!ch.length){ls.innerHTML='<p class="mu">محتوای این کتاب هنوز اضافه نشده است.</p>';return}
  ls.innerHTML=ch.map((c,i)=>'<button class="item" data-i="'+i+'"><span class="chip">'+(i+1)+'</span>'+c.t+(c.h?'':' <span class="mu">(به‌زودی)</span>')+'</button>').join("");
  ls.querySelectorAll(".item").forEach(b=>b.onclick=()=>chap(n,ch[b.dataset.i]));
}
function chap(n,c){
  app.innerHTML='<button class="back" id="bk">→ بازگشت به فصل‌ها</button><h1>'+c.t+'</h1><p class="sub">'+n+' · پایه‌ی نهم</p><div class="box">'+(c.h||'<p class="mu">محتوای این فصل هنوز اضافه نشده است.</p>')+'</div>';
  document.getElementById("bk").onclick=()=>book(n);
}
home();
</script>
</body>
</html>
